<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KIIP Level 4 Lesson 4 Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Fallback/Default Dark Theme Variables */
            --primary-color: #FFC107;
            --bg-color: #0A0E1A;
            --text-color: #FFFFFF;
            --card-bg: #161B2E;
            --correct-color: #10B981;
            --incorrect-color: #EF4444;
        }

        body {
            font-family: 'Noto Sans KR', 'Battambang', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Support for Android Theme variables if provided globally */
        @media (min-height: 48px) {
            .touch-btn {
                min-height: 48px;
            }
        }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col justify-between select-none">

    <header class="w-full max-w-xl mx-auto mb-4 flex justify-between items-center border-b border-gray-700 pb-2">
        <div>
            <h1 class="text-xl font-bold text-[var(--primary-color)]">KIIP កម្រិត ៤ - មេរៀនទី ៤</h1>
            <p class="text-xs text-gray-400">제4과 한국의 의례 (ពិធីការកូរ៉េ)</p>
        </div>
        <div class="text-right">
            <span id="progress-text" class="text-sm font-semibold">សំណួរ: 1/30</span>
            <div class="w-24 bg-gray-700 h-2 rounded-full overflow-hidden mt-1">
                <div id="progress-bar" class="bg-[var(--primary-color)] h-full transition-all duration-300" style="width: 3.33%"></div>
            </div>
        </div>
    </header>

    <main class="w-full max-w-xl mx-auto flex-grow flex flex-col justify-center">
        
        <div class="flex justify-between gap-2 mb-4">
            <button onclick="quizManager.powerUp('translateQ')" class="touch-btn flex-1 bg-slate-800 text-xs py-2 px-1 rounded-xl font-medium border border-slate-700 hover:bg-slate-700 active:scale-95 transition text-white">
                🌐 បកប្រែសំណួរ
            </button>
            <button onclick="quizManager.powerUp('fiftyFifty')" class="touch-btn flex-1 bg-slate-800 text-xs py-2 px-1 rounded-xl font-medium border border-slate-700 hover:bg-slate-700 active:scale-95 transition text-white">
                ✂️ កាត់ ៥០/៥០
            </button>
            <button onclick="quizManager.powerUp('translateOptions')" class="touch-btn flex-1 bg-slate-800 text-xs py-2 px-1 rounded-xl font-medium border border-slate-700 hover:bg-slate-700 active:scale-95 transition text-white">
                📝 បកប្រែចម្លើយ
            </button>
        </div>

        <div class="quiz-card p-5 rounded-2xl shadow-xl mb-4 relative">
            <button onclick="quizManager.speakCurrentQuestion()" class="absolute top-3 right-3 text-xl p-2 bg-slate-800 rounded-full hover:bg-slate-700 text-white active:scale-90 transition">
                🔈
            </button>

            <span id="section-title" class="text-xs font-bold uppercase tracking-wider text-[var(--primary-color)] block mb-2">ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍</span>
            
            <div class="pr-8">
                <p id="question-ko" class="text-lg font-medium leading-relaxed mb-1"></p>
                <p id="question-kh-reading" class="text-xs text-slate-400 hidden mb-1"></p>
                <p id="question-kh" class="text-sm text-slate-300 hidden"></p>
            </div>
        </div>

        <div id="options-container" class="space-y-3">
            </div>

        <div id="explanation-container" class="quiz-card p-4 rounded-2xl mt-4 hidden border-l-4 border-[var(--primary-color)]">
            <h3 class="text-sm font-bold text-[var(--primary-color)] mb-2">💡 ការពន្យល់លម្អិត (Explanation)</h3>
            <p id="explanation-text" class="text-sm text-gray-200 mb-3"></p>
            <div class="border-t border-slate-700 pt-2">
                <h4 class="text-xs font-bold text-slate-400 mb-1">📋 ពាក្យគន្លឹះក្នុងសំណួរ៖</h4>
                <ul id="vocab-list" class="text-xs space-y-1 text-slate-300"></ul>
            </div>
        </div>

    </main>

    <footer class="w-full max-w-xl mx-auto mt-4 pt-2 flex justify-end">
        <button id="next-btn" onclick="quizManager.nextQuestion()" class="touch-btn bg-[var(--primary-color)] text-slate-950 font-bold px-6 py-3 rounded-xl shadow-lg transition active:scale-95 hidden">
            សំណួរបន្ទាប់ ➡️
        </button>
    </footer>

    <div id="result-modal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#161B2E] max-w-md w-full rounded-3xl p-6 text-center border border-slate-800 shadow-2xl">
            <h2 class="text-2xl font-bold text-[var(--primary-color)] mb-2">🎉 បញ្ចប់ការតេស្តសាកល្បង!</h2>
            <p class="text-sm text-gray-400 mb-4">제4과 한국의 의례 (중간평가 ត្រៀម)</p>
            
            <div class="bg-slate-900/60 p-4 rounded-2xl mb-6">
                <span class="text-xs text-slate-400 block mb-1">ពិន្ទុរបស់អ្នកទទួលបាន</span>
                <span id="final-score" class="text-4xl font-black text-emerald-400">0 / 30</span>
            </div>

            <div class="space-y-3">
                <button onclick="quizManager.restartQuiz()" class="touch-btn w-full bg-[var(--primary-color)] text-slate-950 font-bold py-3 rounded-xl transition active:scale-95">
                    🔄 ធ្វើតេស្តឡើងវិញម្តងទៀត
                </button>
                <button onclick="quizManager.closeResultModal()" class="touch-btn w-full bg-slate-800 text-white font-medium py-3 rounded-xl transition active:scale-95 border border-slate-700">
                    🔍 ឆែកមើលចម្លើយឡើងវិញ
                </button>
            </div>
        </div>
    </div>

    <script>
        // 30 Standardized Questions for Level 4 Lesson 4
        // Topics covered: Vocabulary (page 59), Grammar -더니 & -은 나머지, Reading (한국의 의례), Culture (page 58 성년의 날)
        const quizData = [
            // 1-10: Vocabulary & Grammar
            {
                section: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍ (សំណួរទី ១-១០)",
                ko: "한국에서는 아기가 태어난 지 1년이 되면 무엇을 합니까?",
                kh: "នៅប្រទេសកូរ៉េ តើគេធ្វើអ្វីខ្លះនៅពេលដែលទារកកើតបានរយៈពេល ១ ឆ្នាំ?",
                reading: "ហានគុកេដូនឹន អាគីកា ថែអូណាន ជី អ៊ីលន្យ៉ូនី ថ្វេម្យូន មូអូស៊ឹល ហាំនីកា?",
                options: ["돌잔치", "환갑잔치", "결혼식", "장례식"],
                optionsKh: ["ពិធីខួបកំណើត ១ ឆ្នាំ", "ពិធីបុណ្យអាយុ ៦០ ឆ្នាំ", "ពិធីមង្គលការ", "ពិធីបុណ្យសព"],
                answer: 0,
                explanation: "돌잔치 គឺជាពិធីខួបកំណើតគម្រប់អាយុ ១ ឆ្នាំដំបូងរបស់ក្មេងតូចនៅកូរ៉េ ដែលមានការធ្វើពិធីផ្សងសំណាង (돌잡이) ផងដែរ។",
                vocab: [["태어나다", "កើត"], ["1년", "មួយឆ្នាំ"], ["돌잔치", "បុណ្យខួប ១ ឆ្នាំ"]]
            },
            {
                section: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍ (សំណួរទី ១-១០)",
                ko: "어제 술을 많이 (____) 오늘 아침에 머리가 너무 아파요.",
                kh: "កាលពីម្សិលមិញដោយសារតែ (ផឹក) ស្រាច្រើនពេក ព្រឹកនេះក៏ឈឺក្បាលខ្លាំងណាស់។",
                reading: "អូជេ ស៊ូឡ៊ឹល ម៉ានី (____) អូណឹល អាឈីមេ ម៉ូរីកា ណូពូ អាផាយ៉ូ។",
                options: ["마셨더니", "마셨으면", "마시는 나머지", "마실수록"],
                optionsKh: ["ផឹកហើយក៏ (បង្ហាញលទ្ធផល)", "ប្រសិនបើបានផឹក", "ជាលទ្ធផលហួសហេតុនៃផឹក", "កាន់តែផឹក...កាន់តែ"],
                answer: 0,
                explanation: "វេយ្យាករណ៍ -더니 ប្រើដើម្បីបង្ហាញពីសកម្មភាព ឬហេតុការណ៍ដែលបានសង្កេតឃើញ/ធ្វើកាលពីអតីតកាល ហើយនាំមកនូវលទ្ធផលនៅពេលបច្ចុប្បន្ន។",
                vocab: [["어제", "ម្សិលមិញ"], ["술", "ស្រា"], ["머리가 아프다", "ឈឺក្បាល"]]
            },
            {
                section: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍ (សំណួរទី ១-១០)",
                ko: "시험 결과가 너무 걱정되어서 잠을 못 (____) 시험을 망쳤어요.",
                kh: "ដោយសារតែ (បារម្ភហួសហេតុ) ពេកអំពីលទ្ធផលប្រឡង រហូតដល់គេងមិនលក់ ក៏ធ្វើឱ្យខូចការប្រឡងអស់។",
                reading: "ស៊ីហម គ្យ៉ុលក្វាកា ណូមូ ខុកចង់ទ្វេអូស៊ូ ចាម៊ឹល មុត (____) ស៊ីហម៊ឹល ម៉ង់ឆ្យូសសូយ៉ូ។",
                options: ["잔 나머지", "잔 고작", "자더니", "잘수록"],
                optionsKh: ["លទ្ធផលហួសហេតុនៃការគេង", "គ្រាន់តែគេង", "គេងហើយក៏", "កាន់តែគេង"],
                answer: 0,
                explanation: "វេយ្យាករណ៍ -은 나머지 ប្រើដើម្បីបង្ហាញពីសកម្មភាព ឬអារម្មណ៍ដែលហួសកម្រិត (Extremely) រហូតដល់បង្កើតជាលទ្ធផលមិនល្អមួយនៅផ្នែកខាងក្រោយ។",
                vocab: [["시험 결과", "លទ្ធផលប្រឡង"], ["걱정되다", "បារម្ភ"], ["망치다", "ធ្វើឱ្យខូច/ខកខាន"]]
            },
            {
                section: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍ (សំណួរទី ១-១០)",
                ko: "한국의 전통적인 장례식에 갈 때 보통 무슨 색 옷을 입습니까?",
                kh: "តើគេជឿថាគួរតែស្លៀកពាក់ខោអាវពណ៌អ្វី នៅពេលទៅចូលរួមពិធីបុណ្យសពប្រពៃណីកូរ៉េ?",
                reading: "ហានគូគេ ឆន់ថុងចូគីន ឆាំងរេហ្ស៊ីកេ ខាល ថេ បូថុង មូស៊ឹន សេក អូស៊ឹល អ៊ីបនីកា?",
                options: ["검은색 옷", "빨간색 옷", "노란색 옷", "흰색 옷"],
                optionsKh: ["សម្លៀកបំពាក់ពណ៌ខ្មៅ", "សម្លៀកបំពាក់ពណ៌ក្រហម", "សម្លៀកបំពាក់ពណ៌លឿង", "សម្លៀកបំពាក់ពណ៌ស"],
                answer: 0,
                explanation: "នៅពេលទៅបុណ្យសព (장례식) នៅប្រទេសកូរ៉េ ភ្ញៀវចូលរួមត្រូវស្លៀកពាក់ពណ៌ខ្មៅ (검은색) ឬពណ៌ងងឹតសុភាពរាបសារ។",
                vocab: [["장례식", "ពិធីបុណ្យសព"], ["보통", "ជាធម្មតា"], ["검은색 옷", "ខោអាវពណ៌ខ្មៅ"]]
            },
            {
                section: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍ (សំណួរទី ១-១០)",
                ko: "열심히 공부하(____) 결국 KIIP 4단계를 합격했습니다.",
                kh: "ខំប្រឹងប្រែងរៀនសូត្រ (ហើយលទ្ធផលគឺ) ចុងក្រោយក៏បានប្រឡងជាប់ KIIP កម្រិត ៤។",
                reading: "យ៉លស៊ីមី ខុងប៊ូហា(____) គ្យ៉ុលគុក ខេអាយអាយភី សាថាញ់កេរ៊ឹល ហាប់គ្យុកឃេសស៊ឹបនីដា។",
                options: ["더니", "은 나머지", "느라고", "을수록"],
                optionsKh: ["ធ្វើរួចហើយក៏ឃើញលទ្ធផល", "ជាលទ្ធផលហួសហេតុ", "រវល់តែ...ទើប", "កាន់តែ...កាន់តែ"],
                answer: 0,
                explanation: "공부하더니 សមស្របបំផុតព្រោះបង្ហាញពីការតស៊ូព្យាយាមកាលពីអតីតកាល រហូតទទួលបានផ្លែផ្កាជាប់ការប្រឡងនៅពេលក្រោយ។",
                vocab: [["열심히", "យ៉ាងខំប្រឹង"], ["결국", "ចុងក្រោយ"], ["합격하다", "ប្រឡងជាប់"]]
            },
            {
                section: "ផ្នែកពាក្យសព្ទ និងវេយ្យាករណ៍ (សំណួរទី ១-១០)",
                ko: "결혼식에 온 하객들이 신랑과 신부에게 주는 돈을 무엇이라고 합니까?",
                kh: "តើលុយដែលភ្ញៀវចូលរួមមង្គលការជូនទៅកូនប្រុសនិងកូនស្រីហៅថាអ្វី?",
                reading: "គ្យ៉ុលហុនស៊ីកេ អ៊ុន ហាកេកឌឺរី ស៊ីនរ៉ង់ក្វា ស៊ីនប៊ូអេរ៉េ ជូនឹន ដូន៊ឹល មូអូស៊ីរ៉ាគោ ហាំនីកា?",
                options: ["축의금", "조의금", "세뱃돈", "용돈"],

                options: ["열정적인 사랑과 축하", "돈을 많이 벌라는 뜻", "공부를 더 열심히 하라는 뜻", "건강하게 오래 살라는 뜻"],

                optionsKh: ["រៀបការដោយមិនបាច់មានការយល់ព្រមពីឪពុកម្តាយ", "បោះឆ្នោតជ្រើសរើសថ្នាក់ដឹកនាំ", "ទិញស្រា ឬបារីដោយសេរី", "កែប្រែថវិកាជាតិស្រដៀងចិត្តខ្លួនឯង"],

                explanation: "នៅពេលអាយុ 만 19세 អ្នកមានសិទ្ធិបោះឆ្នោត ទិញស្រាបារី និងរៀបការដោយខ្លួនឯងបាន ប៉ុន្តែការកែប្រែថវិកាជាតិ (국가 예산) គឺមិនមែនជាសិទ្ធិផ្ទាល់ខ្លួនឡើយ។",
                vocab: [["법적 권리", "សិទ្ធិស្របច្បាប់"], ["동의 없이", "ដោយគ្មានការយល់ព្រម"], ["투표하기", "ការបោះឆ្នោត"]]
            }

        // Quiz Manager Class to maintain state and control UI
        class QuizManager {
            constructor(data) {
                this.data = data;
                this.currentIndex = 0;
                this.score = 0;
                this.userAnswers = new Array(data.length).fill(null);
                this.isAnswered = false;
                this.powerUpStatus = { translateQ: false, fiftyFifty: false, translateOptions: false };
            }

            init() {
                // Synchronize with Android interface if exists
                if (typeof Android !== 'undefined' && typeof Android.isDarkMode === 'function') {
                    if (Android.isDarkMode()) {
                        document.documentElement.style.setProperty('--bg-color', '#0A0E1A');
                        document.documentElement.style.setProperty('--card-bg', '#161B2E');
                        document.documentElement.style.setProperty('--text-color', '#FFFFFF');
                    }
                }
                this.showQuestion();
            }

            showQuestion() {
                this.isAnswered = false;
                this.resetPowerUpsUI();
                
                const current = this.data[this.currentIndex];
                
                // Update header progress
                document.getElementById('progress-text').innerText = `សំណួរ: ${this.currentIndex + 1}/${this.data.length}`;
                document.getElementById('progress-bar').style.width = `${((this.currentIndex + 1) / this.data.length) * 100}%`;
                
                // Section and Question Texts
                document.getElementById('section-title').innerText = current.section;
                document.getElementById('question-ko').innerText = current.ko;
                document.getElementById('question-kh-reading').innerText = `🎙️ របៀបអាន៖ ${current.reading}`;
                document.getElementById('question-kh').innerText = `🇰🇭 ន័យខ្មែរ៖ ${current.kh}`;
                
                // Hide helper layout initially (Smart Challenge)
                document.getElementById('question-kh-reading').classList.add('hidden');
                document.getElementById('question-kh').classList.add('hidden');
                document.getElementById('explanation-container').classList.add('hidden');
                document.getElementById('next-btn').classList.add('hidden');

                // Render Options
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';

                current.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `opt-${idx}`;
                    btn.className = "touch-btn w-full quiz-card text-left p-4 rounded-xl font-medium flex flex-col justify-center border border-slate-700/50 hover:border-[var(--primary-color)] transition active:scale-[0.99]";
                    
                    // Inside layout for options
                    btn.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold border border-slate-600 text-slate-300 idx-label">${idx + 1}</span>
                            <span class="text-base text-white opt-text-ko">${opt}</span>
                        </div>
                        <span class="text-xs text-slate-400 mt-1 pl-10 hidden opt-text-kh">👉 ${current.optionsKh[idx]}</span>
                    `;
                    
                    btn.onclick = () => this.checkAnswer(idx);
                    optionsContainer.appendChild(btn);
                });
            }

            checkAnswer(selectedIndex) {
                if (this.isAnswered) return;
                this.isAnswered = true;
                
                const current = this.data[this.currentIndex];
                this.userAnswers[this.currentIndex] = selectedIndex;

                // Reveal all language translations and reading tools
                document.getElementById('question-kh-reading').classList.remove('hidden');
                document.getElementById('question-kh').classList.remove('hidden');
                
                // Show explanations
                document.getElementById('explanation-text').innerText = current.explanation;
                const vocabList = document.getElementById('vocab-list');
                vocabList.innerHTML = '';
                current.vocab.forEach(v => {
                    vocabList.innerHTML += `<li>🔹 <b class="text-[var(--primary-color)]">${v[0]}</b>: ${v[1]}</li>`;
                });
                document.getElementById('explanation-container').classList.remove('hidden');

                // Highlight answers
                current.options.forEach((_, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    btn.disabled = true;
                    // Always show Khmer meaning after response
                    btn.querySelector('.opt-text-kh').classList.remove('hidden');
                    
                    if (idx === current.answer) {
                        btn.style.borderColor = 'var(--correct-color)';
                        btn.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                        btn.querySelector('.idx-label').style.backgroundColor = 'var(--correct-color)';
                        btn.querySelector('.idx-label').style.color = '#000000';
                    }
                    
                    if (idx === selectedIndex && selectedIndex !== current.answer) {
                        btn.style.borderColor = 'var(--incorrect-color)';
                        btn.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
                        btn.querySelector('.idx-label').style.backgroundColor = 'var(--incorrect-color)';
                        btn.querySelector('.idx-label').style.color = '#FFFFFF';
                    }
                });

                if (selectedIndex === current.answer) {
                    this.score++;
                }

                // TTS trigger automatically for premium learning feel
                this.speak(current.ko);

                // Show Next Button
                document.getElementById('next-btn').classList.remove('hidden');
            }

            powerUp(type) {
                if (this.isAnswered) return; // Prevent powerup usage after answering
                
                const current = this.data[this.currentIndex];

                if (type === 'translateQ') {
                    document.getElementById('question-kh').classList.toggle('hidden');
                } 
                else if (type === 'translateOptions') {
                    this.data[this.currentIndex].options.forEach((_, idx) => {
                        document.getElementById(`opt-${idx}`).querySelector('.opt-text-kh').classList.toggle('hidden');
                    });
                } 
                else if (type === 'fiftyFifty') {
                    if (this.powerUpStatus.fiftyFifty) return;
                    this.powerUpStatus.fiftyFifty = true;
                    
                    let count = 0;
                    const correctIdx = current.answer;
                    
                    // Hide 2 incorrect answers randomly
                    const indices = [0, 1, 2, 3].filter(i => i !== correctIdx);
                    // Shuffle wrong elements
                    indices.sort(() => Math.random() - 0.5);
                    
                    // Disable 2 options
                    document.getElementById(`opt-${indices[0]}`).style.opacity = '0.2';
                    document.getElementById(`opt-${indices[0]}`).disabled = true;
                    document.getElementById(`opt-${indices[1]}`).style.opacity = '0.2';
                    document.getElementById(`opt-${indices[1]}`).disabled = true;
                }
            }

            resetPowerUpsUI() {
                this.powerUpStatus.fiftyFifty = false;
            }

            nextQuestion() {
                if (this.currentIndex < this.data.length - 1) {
                    this.currentIndex++;
                    this.showQuestion();
                } else {
                    this.showResult();
                }
            }

            showResult() {
                document.getElementById('final-score').innerText = `${this.score} / ${this.data.length}`;
                document.getElementById('result-modal').classList.remove('hidden');
            }

            closeResultModal() {
                document.getElementById('result-modal').classList.add('hidden');
                // Allow user to freely browse and review all 30 items
                this.currentIndex = 0;
                this.showQuestion();
            }

            restartQuiz() {
                this.currentIndex = 0;
                this.score = 0;
                this.userAnswers.fill(null);
                document.getElementById('result-modal').classList.add('hidden');
                this.showQuestion();
            }

            speakCurrentQuestion() {
                const current = this.data[this.currentIndex];
                this.speak(current.ko);
            }

            speak(text) {
                // 1. Android JavaScript Interface Integration
                if (typeof Android !== 'undefined' && typeof Android.speak === 'function') {
                    Android.speak(text);
                } 
                // 2. High Quality TTS Fallback (Google TTS API online proxy)
                else if (navigator.onLine) {
                    const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=${encodeURIComponent(text)}`);
                    audio.play().catch(() => this.webSpeechFallback(text));
                } 
                // 3. Web Speech API Fallback (Offline)
                else {
                    this.webSpeechFallback(text);
                }
            }

            webSpeechFallback(text) {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR';
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        // Initialize App on load
        const quizManager = new QuizManager(quizData);
        window.onload = () => quizManager.init();
    </script>
