<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIIP Level 4 Lesson 3 Quiz</title>
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Hanuman:wght@300;400;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables synchronized with Android App or using custom premium dark theme as default */
        :root {
            --primary-color: #FFC107;
            --bg-color: #0A0E1A;
            --text-color: #FFFFFF;
            --card-bg: #161B2E;
            --correct-color: #10B981;
            --incorrect-color: #EF4444;
            --text-secondary: #94A3B8;
        }

        /* Support light/dark mode based on Android App setting */
        body.light-mode {
            --primary-color: #D97706;
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --card-bg: #FFFFFF;
            --text-secondary: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans KR', 'Hanuman', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Premium Mobile Layout Container */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Header Style */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            margin-bottom: 16px;
        }

        .level-badge {
            background: linear-gradient(135deg, var(--primary-color), #FF9800);
            color: #000;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(255, 193, 7, 0.2);
        }

        .score-board {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
        }

        /* Card container */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(148, 163, 184, 0.1);
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        /* Question style */
        .question-meta {
            font-size: 13px;
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .question-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* Helper Translation text (Initially hidden unless powerup used or answered) */
        .translation-box {
            background-color: rgba(148, 163, 184, 0.05);
            border-left: 4px solid var(--primary-color);
            padding: 12px;
            border-radius: 4px 12px 12px 4px;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .reading-box {
            font-style: italic;
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* TTS Audio Controller container */
        .audio-container {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-audio {
            background-color: rgba(255, 193, 7, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            transition: all 0.2s ease;
        }

        .btn-audio:active {
            transform: scale(0.95);
            background-color: rgba(255, 193, 7, 0.2);
        }

        .btn-audio.playing {
            background-color: var(--primary-color);
            color: #000;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,193,7, 0.4); }
            100% { transform: scale(1.03); box-shadow: 0 0 10px 4px rgba(255,193,7, 0.2); }
        }

        /* Helper game powerups */
        .powerups-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-powerup {
            background-color: rgba(148, 163, 184, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.15);
            color: var(--text-color);
            padding: 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 52px;
        }

        .btn-powerup:active:not(:disabled) {
            transform: scale(0.95);
            background-color: rgba(148, 163, 184, 0.15);
        }

        .btn-powerup:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-powerup.active {
            border-color: var(--primary-color);
            background-color: rgba(255, 193, 7, 0.1);
            color: var(--primary-color);
        }

        .powerup-count {
            background-color: rgba(148, 163, 184, 0.2);
            color: var(--text-color);
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 9px;
            margin-top: 2px;
        }

        .active .powerup-count {
            background-color: var(--primary-color);
            color: #000;
        }

        /* Option buttons */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            background-color: rgba(148, 163, 184, 0.05);
            border: 2px solid rgba(148, 163, 184, 0.15);
            color: var(--text-color);
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            width: 100%;
            min-height: 54px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-option:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: rgba(255, 193, 7, 0.03);
        }

        .btn-option.correct {
            border-color: var(--correct-color) !important;
            background-color: rgba(16, 185, 129, 0.1) !important;
            color: var(--correct-color) !important;
            font-weight: 700;
        }

        .btn-option.incorrect {
            border-color: var(--incorrect-color) !important;
            background-color: rgba(239, 68, 68, 0.1) !important;
            color: var(--incorrect-color) !important;
        }

        .btn-option.eliminated {
            opacity: 0.15;
            pointer-events: none;
        }

        .option-translation {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            border-top: 1px dashed rgba(148, 163, 184, 0.2);
            padding-top: 4px;
            width: 100%;
        }

        /* Smart Reveal Section (Explains details after answer) */
        .reveal-section {
            background-color: rgba(148, 163, 184, 0.03);
            border-top: 2px solid rgba(148, 163, 184, 0.1);
            padding: 20px 0 0 0;
            margin-top: 20px;
        }

        .explanation-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .explanation-text {
            font-size: 14px;
            color: var(--text-color);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        /* Vocab list breakdown */
        .vocab-breakdown {
            background-color: rgba(148, 163, 184, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            flex-direction: column;
            padding: 8px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .vocab-item:last-child {
            border-bottom: none;
        }

        .vocab-korean {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 15px;
        }

        .vocab-details {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Bottom Controls (Next, Result, Back to Home) */
        .controls-container {
            display: flex;
            gap: 12px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .btn-action {
            flex: 1;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            min-height: 48px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
        }

        .btn-action:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Result View */
        .result-view {
            text-align: center;
            padding: 20px 0;
        }

        .result-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 6px solid var(--primary-color);
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            background-color: rgba(255, 193, 7, 0.05);
        }

        .result-score {
            font-size: 38px;
            font-weight: 900;
            color: var(--primary-color);
        }

        .result-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .result-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        /* Review list container */
        .review-list {
            margin-top: 24px;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .review-item {
            background-color: rgba(148, 163, 184, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #ccc;
        }

        .review-item.correct {
            border-left-color: var(--correct-color);
        }

        .review-item.incorrect {
            border-left-color: var(--incorrect-color);
        }

        /* Custom Scrollbar for review */
        .review-list::-webkit-scrollbar {
            width: 6px;
        }
        .review-list::-webkit-scrollbar-track {
            background: rgba(148, 163, 184, 0.05);
        }
        .review-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 3px;
        }

        /* Traditional Ondol Diagram representation */
        .diagram-container {
            margin: 16px 0;
            padding: 16px;
            background-color: rgba(255, 193, 7, 0.02);
            border: 1px dashed rgba(255, 193, 7, 0.3);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .diagram-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .diagram-badge {
            background-color: rgba(148, 163, 184, 0.1);
            color: var(--text-color);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Reading Comprehension Passage Container */
        .passage-box {
            background-color: rgba(255, 193, 7, 0.02);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 15px;
            line-height: 1.7;
            text-align: justify;
        }

        .passage-translation {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(148, 163, 184, 0.2);
        }

        .passage-reading {
            font-size: 12px;
            color: var(--text-secondary);
            font-style: italic;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div>
                <span class="level-badge" id="levelBadge">KIIP LV4 · L3</span>
            </div>
            <div class="score-board">
                ពិន្ទុ: <span id="currentScore" style="color: var(--primary-color);">0</span>/<span id="totalQuestions">30</span>
            </div>
        </header>

        <!-- Main Quiz View Container -->
        <main id="viewContainer">

        <div class="controls-container">

    <script>
        // Quiz questions array (30 premium curated questions for Level 4 Lesson 3 - 생활 속의 과학)
        const quizQuestions = [
            // PART 1: VOCABULARY & GRAMMAR (Q1 - Q10)
            {
                id: 1,

                reading: "អរ-ជេ ណាល-ស៊ី-ហ្កា ឈុប-ជី អា-ណា-សរ ជុង-អ៊ូ ស៊ី-ហ្កា វ៉េ-ឈុល-រ៉ឺល (      ) ជុល អា-រ៉ា-សូ-យ៉ូ។",
                options: ["한", "할", "하는", "하곤 한"],
                optionsTrans: ["បានធ្វើ (អតីតកាល)", "នឹងធ្វើ (អនាគតកាល)", "កំពុងធ្វើ (បច្ចុប្បន្នកាល)", "ធ្លាប់តែធ្វើ"],
                answer: 0,
                explanation: "ទម្រង់វេយ្យាករណ៍ `-은/ㄴ 줄 알았다` ប្រើជាមួយកិរិយាសព្ទដើម្បីបង្ហាញការស្មានអំពីសកម្មភាពក្នុងអតីតកាល (ស្មានថាបានធ្វើរួចហើយ តែការពិតមិនទាន់ធ្វើទេ)។",
                vocab: [
                    { korean: "외출", reading: "វ៉េ-ឈុល", translation: "ការចេញទៅក្រៅ" },
                    { korean: "-은/ㄴ 줄 알다", reading: "អ៊ឺន/ន ជុល អាល-ដា", translation: "ស្មានថា (អតីតកាល)" },
                    { korean: "날씨", reading: "ណាល-ស៊ី", translation: "ធាតុអាកាស" }
                ]
            },
            {
                id: 2,
                category: "VocabGrammar",
                categoryKhmer: "ពាក្យសព្ទ និងវេយ្យាករណ៍",
                question: "저는 스트레스를 많이 받을 때면 매운 음식을 (      ).",
                translation: "ខ្ញុំតែងតែញ៉ាំអាហារហឹររាល់ពេលដែលខ្ញុំមានស្ត្រេសខ្លាំង។",
                reading: "ចូ-នឺន ស៊ឺ-ថឺ-រេ-ស៊ឺ-រ៉ឺល ម៉ាន-ហ៊ី បា-ឌឺល តេ-ម្យ៉ន ម៉េ-អ៊ុន អ៊ឹម-ស៊ីក-គឹល (      )។",
                options: ["먹곤 해요", "먹는 줄 알아요", "먹는 편이에요", "먹을 뻔했어요"],
                optionsTrans: ["តែងតែញ៉ាំ/ជាទម្លាប់", "ស្មានតែញ៉ាំ", "រាងញ៉ាំច្រើនដែរ", "ស្ទើរតែបានញ៉ាំ"],
                answer: 0,
                explanation: "វេយ្យាករណ៍ `-곤 하다` ប្រើដើម្បីបង្ហាញពីសកម្មភាពដែលតែងតែកើតឡើងដដែលៗ ឬជាទម្លាប់ជាប្រចាំ (តែងតែធ្វើ.../ជាញឹកញាប់...)។",
                vocab: [
                    { korean: "스트레스", reading: "ស៊ឺ-ថឺ-រេ-ស៊ឺ", translation: "ភាពតានតឹង/ស្ត្រេស" },
                    { korean: "매운 음식", reading: "ម៉េ-អ៊ុន អ៊ឹម-ស៊ីក", translation: "អាហារហឹរ" },

            },
            {
                id: 3,
                category: "VocabGrammar",

                question: "과학자들은 매일 실험실에서 연구를 하며 새로운 원리를 (      ).",

                reading: "ក្វា-ហាក់-ចា-ឌឺ-រ៉ឺន ម៉េ-អ៊ីល ស៊ីល-ហ្វម-ស៊ីល-អេសរ យ៉ន់-ហ្គូ-រ៉ឺល ហាម្យ៉ូ សេ-រ៉ូ-អ៊ុន វ៉ុន-រី-រ៉ឺល (      )។",
                options: ["발견합니다", "발명합니다", "배출합니다", "유도합니다"],
                optionsTrans: ["រកឃើញ (Discover)", "បង្កើតថ្មី (Invent)", "បញ្ចេញចោល", "ណែនាំ/ដឹកនាំ"],
                answer: 0,
                explanation: "ពាក្យ '발견하다' មានន័យថា 'រកឃើញ' អ្វីមួយដែលមានស្រាប់ក្នុងធម្មជាតិ (ដូចជាច្បាប់ ឬគោលការណ៍) ខុសពី '발명하다' ដែលមានន័យថា 'បង្កើតថ្មី' (ដូចជាឧបករណ៍)។",
                vocab: [

                            <div class="diagram-container">
                                <div class="diagram-row">
                                    <span>🔥 ចង្ក្រានដុតអុស (아궁이)</span>
                                    <span>➡️</span>
                                    <span class="diagram-badge">កម្តៅបាតឥដ្ឋ (구들장) [នាំកម្តៅ/Conduction]</span>
                                </div>
                                <div class="diagram-row">
                                    <span>💨 ខ្យល់ក្តៅអណ្តែតឡើង (대류)</span>
                                    <span>➡️</span>
                                    <span class="diagram-badge">បន្ទប់ទាំងមូលកក់ក្តៅ [ចរន្តកម្តៅ/Convection]</span>
                                </div>
                            </div>
                        ` : ''}

                        <h2 class="question-title">${q.question}</h2>
                        
                        <!-- Helper Translation & Reading guides (Initially hidden) -->
                        <div id="questionTranslation" class="translation-box" style="display: none;">
                            <strong>ខ្មែរ៖</strong> ${q.translation}
                        </div>
                        <div id="questionReading" class="reading-box" style="display: none;">
                            <strong>អាន៖</strong> ${q.reading}
                        </div>

                        <!-- Speaker controller -->
                        <div class="audio-container">
                            <button id="btnAudioPlay" class="btn-audio" onclick="audioController.toggleQuestionSpeech('${q.question.replace(/'/g, "\\'")}', '${q.translation.replace(/'/g, "\\'")}')">
                                🔈 ស្តាប់ការអាន
                            </button>
                        </div>

                        <!-- Game Powerups Panel -->
                        <div class="powerups-grid">
                            <button id="powerupTranslate" class="btn-powerup" onclick="quizManager.usePowerup('translateQuestion')">
                                🗺️ បកប្រែសំណួរ
                                <span class="powerup-count">${quizState.powerupsRemaining.translateQuestion}</span>
                            </button>
                            <button id="powerup5050" class="btn-powerup" onclick="quizManager.usePowerup('fiftyFifty')">
                                ✂️ កាត់ ៥០/៥០
                                <span class="powerup-count">${quizState.powerupsRemaining.fiftyFifty}</span>
                            </button>
                            <button id="powerupTranslateAnswers" class="btn-powerup" onclick="quizManager.usePowerup('translateAnswers')">
                                👁️ បកប្រែចម្លើយ
                                <span class="powerup-count">${quizState.powerupsRemaining.translateAnswers}</span>
                            </button>
                        </div>

                        <!-- Options List -->
                        <div class="options-list" id="optionsList">
                            ${q.options.map((option, index) => `
                                <button class="btn-option" id="opt_${index}" onclick="quizManager.selectOption(${index})">
                                    <span class="option-text"><strong>${index + 1}.</strong> ${option}</span>
                                    <span class="option-translation" id="optTrans_${index}" style="display: none;">
                                        ${q.optionsTrans[index]}
                                    </span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Smart Reveal Block (Explorations & Vocabulary) -->
                        <div id="revealSection" class="reveal-section" style="display: none;">
                            <div class="explanation-title">💡 ${uiText.km.explanation}</div>
                            <p class="explanation-text">${q.explanation}</p>

                            <div class="explanation-title">📚 ${uiText.km.vocabTitle}</div>
                            <div class="vocab-breakdown">
                                ${q.vocab.map(item => `
                                    <div class="vocab-item">
                                        <span class="vocab-korean">${item.korean}</span>
                                        <span class="vocab-details">(${uiText.km.vocabReading} ${item.reading}) : ${item.translation}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;

                view.innerHTML = html;

                // Reset Action Button
                const actionBtn = document.getElementById("btnAction");
                actionBtn.innerText = "ពិនិត្យចម្លើយ";
                actionBtn.disabled = true;
            },

            usePowerup: function(type) {
                if (quizState.answered) return;
                if (quizState.powerupsRemaining[type] <= 0) return;

                const q = quizQuestions[quizState.currentQuestionIndex];

                if (type === 'translateQuestion') {
                    quizState.powerupsUsedThisQuestion.translateQuestion = true;
                    document.getElementById("questionTranslation").style.display = "block";
                    document.getElementById("questionReading").style.display = "block";
                    if (q.passage) {
                        const passTrans = document.getElementById("passageTranslation");
                        if (passTrans) passTrans.style.display = "block";
                    }
                    document.getElementById("powerupTranslate").classList.add("active");
                } 
                else if (type === 'fiftyFifty') {
                    if (quizState.powerupsUsedThisQuestion.fiftyFifty) return;
                    quizState.powerupsUsedThisQuestion.fiftyFifty = true;
                    
                    // Eliminate two incorrect answers
                    let incorrectIndices = [];
                    for (let i = 0; i < 4; i++) {
                        if (i !== q.answer) incorrectIndices.push(i);
                    }
                    // Shuffle incorrect indices and pick 2
                    incorrectIndices.sort(() => Math.random() - 0.5);
                    quizState.eliminatedOptions = [incorrectIndices[0], incorrectIndices[1]];

                    quizState.eliminatedOptions.forEach(idx => {
                        const optBtn = document.getElementById(`opt_${idx}`);
                        if (optBtn) optBtn.classList.add("eliminated");
                    });

                    document.getElementById("powerup5050").classList.add("active");
                } 
                else if (type === 'translateAnswers') {
                    quizState.powerupsUsedThisQuestion.translateAnswers = true;
                    for (let i = 0; i < 4; i++) {
                        const trans = document.getElementById(`optTrans_${i}`);
                        if (trans) trans.style.display = "block";
                    }
                    document.getElementById("powerupTranslateAnswers").classList.add("active");
                }

                quizState.powerupsRemaining[type]--;
                this.updatePowerupButtons();
            },

            updatePowerupButtons: function() {
                const pTrans = document.getElementById("powerupTranslate");
                const p50 = document.getElementById("powerup5050");
                const pAns = document.getElementById("powerupTranslateAnswers");

                if (pTrans) {
                    pTrans.querySelector(".powerup-count").innerText = quizState.powerupsRemaining.translateQuestion;
                    if (quizState.powerupsRemaining.translateQuestion <= 0) pTrans.disabled = true;
                }
                if (p50) {
                    p50.querySelector(".powerup-count").innerText = quizState.powerupsRemaining.fiftyFifty;
                    if (quizState.powerupsRemaining.fiftyFifty <= 0 || quizState.powerupsUsedThisQuestion.fiftyFifty) p50.disabled = true;
                }
                if (pAns) {
                    pAns.querySelector(".powerup-count").innerText = quizState.powerupsRemaining.translateAnswers;
                    if (quizState.powerupsRemaining.translateAnswers <= 0) pAns.disabled = true;
                }
            },

            selectOption: function(index) {
                if (quizState.answered) return;
                if (quizState.eliminatedOptions.includes(index)) return;

                // Clear previous selections
                for (let i = 0; i < 4; i++) {
                    const opt = document.getElementById(`opt_${i}`);
                    if (opt) opt.style.borderColor = "rgba(148, 163, 184, 0.15)";
                }

                // Highlight selected
                const selectedOpt = document.getElementById(`opt_${index}`);
                if (selectedOpt) {
                    selectedOpt.style.borderColor = "var(--primary-color)";
                }

                quizState.selectedAnswer = index;
                document.getElementById("btnAction").disabled = false;
            },

            handleAction: function() {
                if (!quizState.answered) {
                    this.checkAnswer();
                } else {
                    this.nextQuestion();
                }
            },

            checkAnswer: function() {
                quizState.answered = true;
                audioController.stop();

                const q = quizQuestions[quizState.currentQuestionIndex];
                const isCorrect = quizState.selectedAnswer === q.answer;

                // Save answer for final review
                quizState.userAnswers.push({
                    questionId: q.id,
                    selected: quizState.selectedAnswer,
                    correct: q.answer,
                    isCorrect: isCorrect
                });

                if (isCorrect) {
                    quizState.score++;
                    document.getElementById(`opt_${quizState.selectedAnswer}`).classList.add("correct");
                    audioController.speak("맞았습니다!", "ko");
                } else {
                    document.getElementById(`opt_${quizState.selectedAnswer}`).classList.add("incorrect");
                    document.getElementById(`opt_${q.answer}`).classList.add("correct");
                    audioController.speak("틀렸습니다.", "ko");
                }

                // Rule 5: Show translations dynamically upon answering
                document.getElementById("questionTranslation").style.display = "block";
                document.getElementById("questionReading").style.display = "block";
                if (q.passage) {
                    const passTrans = document.getElementById("passageTranslation");
                    if (passTrans) passTrans.style.display = "block";
                }

                for (let i = 0; i < 4; i++) {
                    const trans = document.getElementById(`optTrans_${i}`);
                    if (trans) trans.style.display = "block";
                }

                // Display detailed explanation
                document.getElementById("revealSection").style.display = "block";

                // Update Action Button
                const actionBtn = document.getElementById("btnAction");
                if (quizState.currentQuestionIndex < quizQuestions.length - 1) {
                    actionBtn.innerText = uiText.km.nextQuestion;
                } else {
                    actionBtn.innerText = uiText.km.viewResult;
                }
            },

            nextQuestion: function() {
                if (quizState.currentQuestionIndex < quizQuestions.length - 1) {
                    quizState.currentQuestionIndex++;
                    this.renderQuestion();
                } else {
                    this.showResult();
                }
            },

            showResult: function() {
                audioController.stop();
                const view = document.getElementById("viewContainer");
                const actionBtn = document.getElementById("btnAction");
                
                // Hide main action button
                actionBtn.style.display = "none";

                // Set score on top bar
                document.getElementById("currentScore").innerText = quizState.score;

                // Custom evaluation message
                let evalMsg = "";
                if (quizState.score === 30) evalMsg = "ពិន្ទុល្អឥតខ្ចោះ! អ្នកជាកំពូលអ្នកប្រាជ្ញវិទ្យាសាស្ត្រកូរ៉េ! 🏆";
                else if (quizState.score >= 25) evalMsg = "ល្អណាស់! សមត្ថភាពរបស់អ្នកត្រៀមប្រឡង 중간평가 បានយ៉ាងងាយស្រួល! 🌟";
                else if (quizState.score >= 18) evalMsg = "ល្អបង្គួរ! សូមបន្តព្យាយាមបន្ថែមទៀតដើម្បីទទួលបានលទ្ធផលកាន់តែប្រសើរ! 👍";
                else evalMsg = "ព្យាយាមឡើងវិញ! កុំបោះបង់ ការរៀនសូត្រនឹងធ្វើឱ្យអ្នកកាន់តែខ្លាំង! 💪";

                let html = `
                    <div class="card result-view">
                        <div class="result-circle">
                            <span class="result-score">${quizState.score}</span>
                            <span style="font-size: 14px; font-weight: 700; color: var(--text-secondary);">ភាគរយ: ${Math.round((quizState.score/30)*100)}%</span>
                        </div>
                        <h2 class="result-text">${uiText.km.congratulations}</h2>
                        <p class="result-desc">${evalMsg}</p>

                        <!-- Review answers header -->
                        <h3 style="font-size: 16px; font-weight: 700; margin-top: 20px; border-bottom: 2px solid rgba(148,163,184,0.1); padding-bottom: 8px;">
                            📋 ${uiText.km.reviewTitle}
                        </h3>

                        <div class="review-list">
                            ${quizState.userAnswers.map((ua, index) => {
                                const q = quizQuestions[index];
                                return `
                                    <div class="review-item ${ua.isCorrect ? 'correct' : 'incorrect'}">
                                        <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px; display:flex; justify-content:space-between;">
                                            <span>សំណួរទី ${q.id} (${q.categoryKhmer})</span>
                                            <span style="color: ${ua.isCorrect ? 'var(--correct-color)' : 'var(--incorrect-color)'};">
                                                ${ua.isCorrect ? '✔️ ត្រូវ' : '❌ ខុស'}
                                            </span>
                                        </div>
                                        <div style="font-size: 13px; margin-bottom: 4px; color: var(--text-color);">${q.question}</div>
                                        <div style="font-size: 12px; color: var(--text-secondary);">
                                            ចម្លើយរបស់អ្នក៖ <strong style="color: var(--primary-color);">${q.options[ua.selected]}</strong> | 
                                            ចម្លើយត្រូវ៖ <strong style="color: var(--correct-color);">${q.options[ua.correct]}</strong>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- Action Controls inside Result -->
                        <div style="margin-top: 24px; display: flex; gap: 12px;">
                            <button class="btn-action" style="background-color: var(--primary-color);" onclick="quizManager.init()">
                                🔄 ${uiText.km.restart}
                            </button>
                        </div>
                    </div>
                `;

                view.innerHTML = html;
            }
        };

        // Window load initialization
        window.onload = function() {
            // Respect light/dark mode Android triggers
            if (typeof Android !== 'undefined' && Android.isDarkMode && Android.isDarkMode()) {
                document.body.classList.remove("light-mode");
            } else {
                // Default to dark mode unless requested
            }
            quizManager.init();
        };
    </script>
</body>
</html>
